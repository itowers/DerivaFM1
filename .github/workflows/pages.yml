# Builds the firmware and publishes the site (emulator, installer, rescue) to GitHub Pages.
# Settings -> Pages -> Source: GitHub Actions. Tags (v0.2), and a new version in firmware.json on main, get a release with the .fwsc.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./fm1 build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/web
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: build/*.fwsc
      # a new version in firmware.json on main: tag it and release the package (the hub takes the newest release)
      - id: ver
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          v=$(python3 -c 'import json; print(json.load(open("firmware.json"))["version"])')
          if [ -z "$(git ls-remote --tags origin "refs/tags/v$v")" ]; then echo "v=$v" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.v != ''
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: DERIVA ${{ steps.ver.outputs.v }}
          files: build/*.fwsc
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
